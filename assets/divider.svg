<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4" viewBox="0 0 1200 4" role="presentation">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00F0FF"/><stop offset="50%" stop-color="#FF003C"/>
    <stop offset="100%" stop-color="#39FF14"/>
  </linearGradient>
  <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .p { animation: slide 6s linear infinite; }
  @keyframes slide { 0% { transform:translateX(-260px) } 100% { transform:translateX(1200px) } }
  @media (prefers-reduced-motion: reduce) { .p { animation:none; opacity:0 } }
</style>
<rect width="1200" height="4" rx="2" fill="url(#g)" opacity="0.85"/>
<rect class="p" x="0" y="0" width="260" height="4" rx="2" fill="url(#pulse)" opacity="0.7"/>
</svg>
